<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STARK INDUSTRIES | CONSTRUCTOR V3.3</title>
    <style>
        body { margin: 0; overflow: hidden; background: #020202; font-family: 'Segoe UI', sans-serif; touch-action: none; }
        #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, transparent 50%, rgba(0,20,30,0.8) 150%); pointer-events: none; }
        .home-btn { position: absolute; top: 20px; left: 20px; background: rgba(0, 20, 30, 0.6); border: 1px solid rgba(0,255,255,0.3); color: #00ffff; padding: 10px 20px; text-decoration: none; font-size: 12px; letter-spacing: 2px; pointer-events: auto; transition: 0.3s; border-radius: 6px; backdrop-filter: blur(10px); z-index: 10; }
        .home-btn:hover { background: #00ffff; color: #000; box-shadow: 0 0 20px rgba(0, 255, 255, 0.6); }
        
        #toolbar { position: absolute; top: 50%; left: 20px; transform: translateY(-50%); display: flex; flex-direction: column; gap: 12px; pointer-events: auto; background: rgba(0,10,15,0.7); padding: 15px; border-radius: 12px; border: 1px solid rgba(0,255,255,0.2); backdrop-filter: blur(10px); z-index: 10;}
        .tool-btn { background: rgba(0, 30, 40, 0.6); border: 1px solid rgba(0,255,255,0.3); color: #00ffff; width: 50px; height: 50px; font-size: 20px; cursor: pointer; transition: 0.3s; border-radius: 8px; display: flex; align-items: center; justify-content: center;}
        .tool-btn:hover { background: rgba(0,255,255,0.2); box-shadow: 0 0 15px rgba(0,255,255,0.4); }
        .tool-btn.active-tool { background: #00ffff; color: black; box-shadow: 0 0 20px #00ffff; border-color: white; }
        .divider { height: 1px; width: 100%; background: rgba(0,255,255,0.2); margin: 5px 0; }
        
        #properties { position: absolute; top: 50%; right: 20px; transform: translateY(-50%); background: rgba(0, 10, 15, 0.7); padding: 25px; border-radius: 12px; border: 1px solid rgba(0,255,255,0.2); pointer-events: auto; display: none; width: 220px; backdrop-filter: blur(10px); box-shadow: -10px 0 30px rgba(0,0,0,0.5); z-index: 10;}
        #properties.active { display: block; }
        label { color: #88ccdd; font-size: 11px; display: block; margin-top: 15px; letter-spacing: 1px; }
        input[type="color"] { width: 100%; border: none; height: 35px; cursor: pointer; border-radius: 5px; background: none; }
        input[type="range"] { width: 100%; margin-top: 5px; accent-color: #00ffff; }
        
        .action-btn { background: rgba(0,0,0,0.5); border: 1px solid rgba(0,255,255,0.4); color: #00ffff; padding: 12px; width: 100%; margin-top: 15px; font-size: 12px; letter-spacing: 2px; cursor: pointer; transition: 0.3s; border-radius: 6px; z-index: 10; position: relative;}
        .action-btn:hover { background: #00ffff; color: black; box-shadow: 0 0 15px rgba(0,255,255,0.5); }
        
        #top-bar { position: absolute; top: 20px; width: 100%; text-align: center; pointer-events: none; z-index: 5;}
        h1 { color: #00ffff; letter-spacing: 8px; font-size: 20px; text-shadow: 0 0 15px rgba(0,255,255,0.6); margin:0; text-transform: uppercase; }
        #multi-badge { display: none; background: #00ffff; color: black; font-size: 10px; padding: 2px 6px; border-radius: 4px; float: right; font-weight: bold; }

        /* COLLAPSIBLE MENU CSS */
        #toggle-icon { transition: transform 0.3s; font-size: 12px; }
        #prop-body { transition: max-height 0.3s ease-out, opacity 0.3s, margin-top 0.3s; overflow: hidden; max-height: 400px; opacity: 1; margin-top: 10px; }
        
        #properties.collapsed #prop-body { max-height: 0; opacity: 0; margin-top: 0; }
        #properties.collapsed #toggle-icon { transform: rotate(-90deg); }
        #properties.collapsed h3 { border-bottom: none; padding-bottom: 0; }

        @media (max-width: 768px) {
            #toolbar { 
                top: auto; bottom: 80px; left: 50%; transform: translateX(-50%); 
                flex-direction: row; flex-wrap: wrap; justify-content: center; width: 90%; padding: 10px;
            }
            .tool-btn { width: 40px; height: 40px; font-size: 16px; }
            .divider { width: 1px; height: 40px; margin: 0 5px; }
            #properties { top: 80px; right: 50%; transform: translateX(50%); width: 90%; max-width: 300px; padding: 15px; }
            .home-btn { top: 10px; left: 10px; padding: 8px 10px; font-size: 10px; }
            h1 { font-size: 14px; margin-top: 10px;}
            #top-bar p { display: none; }
        }
    </style>
    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
    </script>
</head>
<body>
    <div id="hud"></div>
    <a href="index.html" class="home-btn">ᐊ MAIN TERMINAL</a>
    
    <div id="top-bar">
        <h1>NEON CONSTRUCTOR</h1>
        <p style="color:#88ccdd; font-size:11px; letter-spacing: 2px; margin-top:5px;">TEMPORAL STATE ENGINE ONLINE</p>
    </div>

    <div id="toolbar">
        <button class="tool-btn" id="btn-undo" title="Undo (Ctrl+Z)">↶</button>
        <button class="tool-btn" id="btn-redo" title="Redo (Ctrl+Y)">↷</button>
        <div class="divider"></div>
        <button class="tool-btn" id="add-cube" title="Spawn Cube">🧊</button>
        <button class="tool-btn" id="add-sphere" title="Spawn Sphere">⚪</button>
        <button class="tool-btn" id="add-cyl" title="Spawn Cylinder">🛢️</button>
        <div class="divider"></div>
        <button class="tool-btn active-tool" id="tool-move" title="Move (G)">✥</button>
        <button class="tool-btn" id="tool-rotate" title="Rotate (R)">↻</button>
        <button class="tool-btn" id="tool-scale" title="Scale (S)">⤢</button>
    </div>

<div id="properties">
        <h3 id="prop-header" style="color:#00ffff; margin:0; border-bottom:1px solid rgba(0,255,255,0.2); padding-bottom:10px; font-size: 14px; letter-spacing:2px; cursor:pointer; display:flex; justify-content:space-between; align-items:center;">
            <span>⚙️ PROPERTIES <span id="multi-badge">GROUP</span></span>
            <span id="toggle-icon">▼</span>
        </h3>
        <div id="prop-body">
            <label>NEON CORE</label><input type="color" id="prop-color" value="#00ffff">
            <label>PHOTON INTENSITY</label><input type="range" id="prop-glow" min="0" max="2" step="0.1" value="1">
            <label>MATTER DENSITY</label><input type="range" id="prop-opacity" min="0" max="1" step="0.1" value="0.8">
            <button class="action-btn" id="btn-delete" style="border-color: #ff3333; color: #ff3333;">OBLITERATE</button>
        </div>
    </div>

    <div style="position:absolute; bottom:20px; width:100%; text-align:center; pointer-events:auto; display:flex; gap:20px; justify-content:center; z-index: 10;">
        <button class="action-btn" id="btn-import-trigger" style="width: auto; padding: 10px 30px;">📂 IMPORT</button>
        <button class="action-btn" id="btn-export" style="width: auto; padding: 10px 30px;">💾 EXPORT</button>
        <input type="file" id="file-import" accept=".obj" style="display: none;">
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { TransformControls } from 'three/addons/controls/TransformControls.js';
        import { OBJExporter } from 'three/addons/exporters/OBJExporter.js';
        import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020202);
        scene.fog = new THREE.FogExp2(0x000000, 0.03);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
        camera.position.set(8, 8, 12);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.toneMapping = THREE.ReinhardToneMapping;
        document.body.appendChild(renderer.domElement);

        const orbit = new OrbitControls(camera, renderer.domElement);
        orbit.enableDamping = true;

        const transform = new TransformControls(camera, renderer.domElement);
        scene.add(transform);

        const ambient = new THREE.AmbientLight(0xffffff, 0.5); scene.add(ambient);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1); dirLight.position.set(5, 10, 7); scene.add(dirLight);
        const grid = new THREE.GridHelper(20, 20, 0x004444, 0x001111); scene.add(grid);

        const constructionZone = new THREE.Group(); scene.add(constructionZone);
        let selectedObjects = []; 
        const selectionGroup = new THREE.Group(); scene.add(selectionGroup); 

        let stateHistory = [];
        let historyIndex = -1;

        function saveSnapshot() {
            if (historyIndex < stateHistory.length - 1) { stateHistory = stateHistory.slice(0, historyIndex + 1); }
            const snapshot = constructionZone.children.map(obj => ({ 
                uuid: obj.uuid, 
                type: obj.geometry.type, 
                matrix: obj.matrix.toArray(), 
                color: obj.material.color.getHex(), 
                glow: obj.material.emissiveIntensity, 
                opacity: obj.material.opacity 
            }));
            stateHistory.push(snapshot); historyIndex++;
        }

        function restoreSnapshot(snapshot) {
            transform.detach(); updateSelection([]);
            while(constructionZone.children.length > 0) { constructionZone.remove(constructionZone.children[0]); }
            snapshot.forEach(data => {
                let geom;
                if(data.type === 'BoxGeometry') geom = new THREE.BoxGeometry(1, 1, 1);
                else if(data.type === 'SphereGeometry') geom = new THREE.SphereGeometry(0.6, 32, 32);
                else if(data.type === 'CylinderGeometry') geom = new THREE.CylinderGeometry(0.5, 0.5, 1, 32);
                else return; 
                
                const mat = new THREE.MeshStandardMaterial({ color: data.color, emissive: data.color, emissiveIntensity: data.glow, transparent: true, opacity: data.opacity, side: THREE.DoubleSide });
                const mesh = new THREE.Mesh(geom, mat);
                mesh.uuid = data.uuid; mesh.matrixAutoUpdate = false; mesh.matrix.fromArray(data.matrix); mesh.matrix.decompose(mesh.position, mesh.quaternion, mesh.scale); mesh.matrixAutoUpdate = true;
                constructionZone.add(mesh);
            });
        }

        document.getElementById('btn-undo').onclick = () => { if (historyIndex > 0) { historyIndex--; restoreSnapshot(stateHistory[historyIndex]); } else if (historyIndex === 0) { historyIndex--; restoreSnapshot([]); } };
        document.getElementById('btn-redo').onclick = () => { if (historyIndex < stateHistory.length - 1) { historyIndex++; restoreSnapshot(stateHistory[historyIndex]); } };
        transform.addEventListener('dragging-changed', (e) => { orbit.enabled = !e.value; if(!e.value) saveSnapshot(); });

        function createObject(type) {
            let geometry;
            if(type === 'cube') geometry = new THREE.BoxGeometry(1, 1, 1);
            else if(type === 'sphere') geometry = new THREE.SphereGeometry(0.6, 32, 32);
            else if(type === 'cyl') geometry = new THREE.CylinderGeometry(0.5, 0.5, 1, 32);
            const mesh = new THREE.Mesh(geometry, new THREE.MeshStandardMaterial({ color: 0x00ffff, emissive: 0x00ffff, emissiveIntensity: 0.5, transparent: true, opacity: 0.8, side: THREE.DoubleSide }));
            mesh.position.y = 0.5; constructionZone.add(mesh); updateSelection([mesh]); saveSnapshot(); 
        }

        function updateSelection(newSelectionArray) {
            transform.detach();
            while(selectionGroup.children.length > 0) { constructionZone.attach(selectionGroup.children[0]); }
            selectedObjects = newSelectionArray;
            const propPanel = document.getElementById('properties'); const multiBadge = document.getElementById('multi-badge');
           if (selectedObjects.length === 0) { propPanel.classList.remove('active'); return; }
            propPanel.classList.add('active');
            
            // Auto-collapse on mobile to save screen space
            if (window.innerWidth <= 768) {
                propPanel.classList.add('collapsed');
            } else {
                propPanel.classList.remove('collapsed');
            }
            if (selectedObjects.length === 1) {
                multiBadge.style.display = 'none'; const mesh = selectedObjects[0]; transform.attach(mesh);
                document.getElementById('prop-color').value = '#' + mesh.material.color.getHexString(); document.getElementById('prop-opacity').value = mesh.material.opacity; document.getElementById('prop-glow').value = mesh.material.emissiveIntensity;
            } else {
                multiBadge.style.display = 'inline-block'; const box = new THREE.Box3(); selectedObjects.forEach(obj => box.expandByObject(obj));
                selectionGroup.position.copy(box.getCenter(new THREE.Vector3())); selectionGroup.rotation.set(0,0,0); selectionGroup.scale.set(1,1,1);
                selectedObjects.forEach(obj => { selectionGroup.attach(obj); }); transform.attach(selectionGroup);
            }
        }
        
        function setActiveTool(mode, btnId) { transform.setMode(mode); ['tool-move', 'tool-rotate', 'tool-scale'].forEach(id => document.getElementById(id).classList.remove('active-tool')); document.getElementById(btnId).classList.add('active-tool'); }
        document.getElementById('tool-move').onclick = () => setActiveTool('translate', 'tool-move');
        document.getElementById('tool-rotate').onclick = () => setActiveTool('rotate', 'tool-rotate');
        document.getElementById('tool-scale').onclick = () => setActiveTool('scale', 'tool-scale');

        document.getElementById('add-cube').onclick = () => createObject('cube');
        document.getElementById('add-sphere').onclick = () => createObject('sphere');
        document.getElementById('add-cyl').onclick = () => createObject('cyl');
        document.getElementById('btn-delete').onclick = () => { if(selectedObjects.length > 0) { transform.detach(); selectedObjects.forEach(obj => { obj.parent.remove(obj); }); updateSelection([]); saveSnapshot(); } };

        // TOGGLE MENU LOGIC
        document.getElementById('prop-header').addEventListener('click', () => {
            document.getElementById('properties').classList.toggle('collapsed');
        });
        
        // REAL-TIME VISUAL UPDATES
        document.getElementById('prop-color').addEventListener('input', (e) => { const col = new THREE.Color(e.target.value); selectedObjects.forEach(obj => { obj.material.color.set(col); obj.material.emissive.set(col); }); });
        document.getElementById('prop-glow').addEventListener('input', (e) => { selectedObjects.forEach(obj => { obj.material.emissiveIntensity = parseFloat(e.target.value); }); });
        document.getElementById('prop-opacity').addEventListener('input', (e) => { selectedObjects.forEach(obj => { obj.material.opacity = parseFloat(e.target.value); }); });

        // TEMPORAL ENGINE SAVES (Fires only on release)
        document.getElementById('prop-color').addEventListener('change', () => saveSnapshot());
        document.getElementById('prop-glow').addEventListener('change', () => saveSnapshot());
        document.getElementById('prop-opacity').addEventListener('change', () => saveSnapshot());

        window.addEventListener('keydown', (e) => { if(e.key === 'g') setActiveTool('translate', 'tool-move'); if(e.key === 'r') setActiveTool('rotate', 'tool-rotate'); if(e.key === 's') setActiveTool('scale', 'tool-scale'); if(e.key === 'Delete') document.getElementById('btn-delete').click(); if(e.ctrlKey && e.key === 'z') document.getElementById('btn-undo').click(); if(e.ctrlKey && e.key === 'y') document.getElementById('btn-redo').click(); });

        const raycaster = new THREE.Raycaster(); const mouse = new THREE.Vector2();
        window.addEventListener('pointerdown', (e) => {
            if(e.target.closest('button') || e.target.closest('input') || e.target.closest('#properties') || e.target.closest('.home-btn')) return;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            mouse.x = (clientX / window.innerWidth) * 2 - 1; mouse.y = -(clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects([...constructionZone.children, ...selectionGroup.children], true);
            if(intersects.length > 0) {
                let hitObj = intersects[0].object;
                if (e.shiftKey) { const index = selectedObjects.indexOf(hitObj); if (index > -1) updateSelection(selectedObjects.filter(o => o !== hitObj)); else updateSelection([...selectedObjects, hitObj]); } 
                else { if (!selectedObjects.includes(hitObj)) updateSelection([hitObj]); }
            } else { updateSelection([]); }
        });

        document.getElementById('btn-import-trigger').onclick = () => document.getElementById('file-import').click();
        document.getElementById('file-import').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                const loader = new OBJLoader();
                const loadedObj = loader.parse(event.target.result);
                
                loadedObj.traverse((child) => {
                    if (child.isMesh) {
                        child.material = new THREE.MeshStandardMaterial({ 
                            color: 0x00ffff, emissive: 0x00ffff, 
                            emissiveIntensity: 0.5, transparent: true, opacity: 0.8, side: THREE.DoubleSide 
                        });
                        constructionZone.add(child);
                    }
                });
                updateSelection([]);
                saveSnapshot();
            };
            reader.readAsText(file);
            e.target.value = ""; 
        });

        document.getElementById('btn-export').onclick = () => { const currentSelection = [...selectedObjects]; updateSelection([]); const exporter = new OBJExporter(); const result = exporter.parse(constructionZone); const blob = new Blob([result], { type: 'text/plain' }); const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = 'aether_blueprint.obj'; link.click(); updateSelection(currentSelection); };
        
        function animate() { requestAnimationFrame(animate); orbit.update(); renderer.render(scene, camera); } animate();
        window.onresize = () => { camera.aspect = window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); }
    </script>
</body>
</html>
